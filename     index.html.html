<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BREW CONCEPT CAFÉ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap');
:root{--brown:#2b170d;--line:#ddd7d0;--text:#20150f;--soft:#fafafa;--gold:#a88b72}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:#eadfc9;color:var(--text);font-family:'Noto Naskh Arabic',serif;overflow-x:hidden}
.page{width:min(100%,760px);margin:auto;padding:16px 18px 0;position:relative;z-index:2}
.hero{text-align:center;padding:18px 25px 6px}
.logo{width:96px;height:96px;object-fit:contain;display:block;margin:auto}
.brand{font-family:'Playfair Display',serif;font-size:53px;line-height:.93;letter-spacing:1px;margin-top:-4px}
.brand span{display:block}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:13px 0 10px}
.divider:before,.divider:after{content:'';height:1px;background:#b9aaa0;width:75px}
.bean-dot{width:17px;height:17px;border-radius:50%;background:var(--brown);display:block;position:relative;transform:rotate(22deg)}
.bean-dot:after{content:'';position:absolute;left:8px;top:1px;width:2px;height:15px;background:#fff6;transform:rotate(28deg)}
.tagline{font-size:18px;margin:0 0 14px}
.socials,.info{display:grid;gap:10px}
.socials{grid-template-columns:repeat(3,1fr)}
.info{grid-template-columns:1fr 1fr;margin-top:10px}
.info .wide{grid-column:1/-1}
.btn{min-height:50px;border-radius:13px;border:1px solid #ddd7d0;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text);font-family:Arial,sans-serif;font-weight:600;box-shadow:0 4px 13px #0000000b;text-align:center}
.btn.dark{background:var(--brown);color:#fff;border-color:var(--brown)}
.icon{font-size:22px}
.section-title{text-align:center;font-size:29px;font-weight:700;margin:29px 0 8px;display:flex;align-items:center;justify-content:center;gap:13px}
.section-title:before,.section-title:after{content:'';width:62px;height:1px;background:#b7aaa1}
.subtitle{text-align:center;color:#66574e;margin:0 0 12px;font-size:15px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.gallery img{width:100%;aspect-ratio:1/1.28;object-fit:cover;border-radius:12px;display:block;box-shadow:0 5px 16px #0002}
.dots{text-align:center;margin:10px 0 4px;color:#bbb;letter-spacing:4px;font-size:15px}
.dots b{color:var(--brown)}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:9px 13px;border-radius:20px;border:1px solid #ddd;background:#fff;box-shadow:0 3px 10px #0000000a;font-family:inherit;cursor:pointer}
.filter.active{background:var(--brown);color:#fff}
.categories{border:1px solid #e5e1dd;border-radius:13px;overflow:hidden;box-shadow:0 4px 16px #0000000a}
.cat{background:#fff;border-bottom:1px solid #e8e4e0}
.cat:last-child{border-bottom:0}
.cat-head{width:100%;border:0;background:#fff;min-height:58px;padding:8px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;font-family:inherit}
.cat-icon{width:38px;height:38px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.cat-name{font-family:'Cormorant Garamond',serif;font-size:23px;direction:ltr;text-align:left;flex:1}
.count{font-size:13px;color:#594a40}
.count b{display:inline-grid;place-items:center;background:var(--brown);color:#fff;border-radius:50%;width:23px;height:23px;margin-right:5px}
.chev{font-size:20px;transition:.25s}
.cat.open .chev{transform:rotate(180deg)}
.items{display:none;background:#fcfbfa;padding:10px 12px 13px}
.cat.open .items{display:block}
.visual{width:100%;height:150px;object-fit:cover;border-radius:13px;margin-bottom:9px;border:1px solid #e9e0d7}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid #eee9e4;direction:ltr}
.item-name{font-family:'Cormorant Garamond',serif;font-size:18px;flex:1}
.price{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;white-space:nowrap}
.footer{margin:32px -18px 0;background:var(--brown);color:#fff;border-radius:80px 80px 0 0;text-align:center;padding:23px 15px 28px}
.footer strong{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:1px;display:block;line-height:1.2}
.footer div{margin-top:5px;font-size:17px}
.beans{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bean{position:absolute;bottom:-90px;width:25px;height:13px;border-radius:70% 45% 70% 45%;background:linear-gradient(135deg,#8a451e,#32170b 70%);box-shadow:inset 4px 2px 4px #fff4,0 4px 7px #0003;transform:rotate(25deg);animation:rise linear infinite}
.bean:after{content:'';position:absolute;left:50%;top:0;width:3px;height:100%;background:#e7b98c66;transform:rotate(28deg);border-radius:50%}
.bean:nth-child(1){left:2%;animation-duration:12s;animation-delay:-4s}.bean:nth-child(2){left:8%;animation-duration:16s;animation-delay:-10s;transform:scale(.7) rotate(-20deg)}.bean:nth-child(3){left:93%;animation-duration:14s;animation-delay:-8s;transform:scale(1.2) rotate(35deg)}.bean:nth-child(4){left:97%;animation-duration:18s;animation-delay:-14s;transform:scale(.75) rotate(-25deg)}.bean:nth-child(5){left:1%;animation-duration:20s;animation-delay:-17s;transform:scale(.9) rotate(65deg)}.bean:nth-child(6){left:90%;animation-duration:13s;animation-delay:-3s;transform:scale(.65) rotate(10deg)}.bean:nth-child(7){left:5%;animation-duration:17s;animation-delay:-6s;transform:scale(1.15) rotate(-40deg)}.bean:nth-child(8){left:95%;animation-duration:15s;animation-delay:-11s;transform:scale(.9) rotate(50deg)}
@keyframes rise{0%{bottom:-80px;opacity:0}10%{opacity:1}50%{translate:15px -10px}100%{bottom:110%;opacity:0;translate:-12px 5px;rotate:360deg}}
.lang{position:fixed;left:15px;top:15px;z-index:20;border:1px solid #ddd7d0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
@media(max-width:520px){.page{padding:12px 12px 0}.brand{font-size:48px}.logo{width:88px;height:88px}.hero{padding-top:22px}.socials{gap:8px}.btn{font-size:13px}.section-title{font-size:27px}.gallery{gap:7px}.cat-name{font-size:21px}.visual{height:135px}.footer{margin-left:-12px;margin-right:-12px}}
</style>
</head>

let lang='ar', filter='all';
const names={
 ar:{acai:'أكاي',milkshake:'ميلك شيك',cold:'القهوة الباردة',hot:'القهوة الساخنة',juice:'العصائر',croissant:'كرواسون',matcha:'ماتشا',mojito:'موهيتو',sweet:'الحلويات',v60:'V60'},
 en:{acai:'AÇAÍ',milkshake:'MILKSHAKES',cold:'COLD COFFEE',hot:'HOT COFFEE',juice:'JUICE',croissant:'CROISSANTS',matcha:'MATCHA',mojito:'MOJITO',sweet:'SWEET',v60:'V60'}
};
const other=['acai','milkshake','juice','croissant','matcha','mojito','sweet','v60'];
function allowed(c){
 if(filter==='all') return true;
 if(filter==='hot') return c.key==='hot';
 if(filter==='cold') return c.key==='cold';
 return other.includes(c.key);
}
function render(){
 const box=document.getElementById('cats'); box.innerHTML='';
 DATA.filter(allowed).forEach(c=>{
  const d=document.createElement('div'); d.className='cat';
  const n=lang==='ar'?c.ar:c.en;
  const items=c.items.map(x=>`<div class="item"><span class="item-name">${lang==='ar'?x[1]:x[0]}</span><span class="price">AED ${x[2]}</span></div>`).join('');
  d.innerHTML=`<button class="cat-head"><span class="cat-icon">${c.icon}</span><span class="cat-name">${n}</span><span class="count">${lang==='ar'?'مشروبات':'Items'} <b>${c.items.length}</b></span><span class="chev">⌄</span></button><div class="items"><img class="visual" src="${VISUALS[c.key]}" alt="${n}">${items}</div>`;
  d.querySelector('.cat-head').onclick=()=>d.classList.toggle('open');
  box.appendChild(d);
 });
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active')); b.classList.add('active');
 filter=b.dataset.filter; render();
 if(filter==='hot') setTimeout(()=>document.querySelector('.cat')?.classList.add('open'),30);
});
document.getElementById('langBtn').onclick=()=>{
 lang=lang==='ar'?'en':'ar'; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.getElementById('langBtn').textContent=lang==='ar'?'EN':'عربي';
 document.getElementById('tagline').textContent=lang==='ar'?'كل كوب .. فكرة تُحضر بإتقان':'Every cup .. a concept crafted with precision';
 document.getElementById('galleryTitle').textContent=lang==='ar'?'معرض المقهى':'Café Gallery';
 document.getElementById('menuTitle').textContent=lang==='ar'?'قائمة المشروبات':'Our Menu';
 document.getElementById('subtitle').textContent=lang==='ar'?'اختر من مجموعتنا المختارة بعناية من أجود الحبوب والمكونات':'Choose from our carefully selected coffee, drinks and treats';
 document.getElementById('maps').innerHTML=lang==='ar'?'الموقع على الخريطة<br>Google Maps':'Location on map<br>Google Maps';
 document.getElementById('review').innerHTML=lang==='ar'?'قيمنا على Google<br>اترك تقييمك':'Rate us on Google<br>Leave a review';
 document.getElementById('call').innerHTML=lang==='ar'?'اتصل بنا<br>اتصل الآن':'Call Us<br>Contact us';
 document.getElementById('footerTag').textContent=lang==='ar'?'نحب القهوة · نصنع التجربة':'We love coffee · We craft the experience';
 const fs={all:lang==='ar'?'الكل':'All',hot:lang==='ar'?'القهوة الساخنة':'Hot Coffee',cold:lang==='ar'?'القهوة الباردة':'Cold Coffee',other:lang==='ar'?'المشروبات الأخرى':'Other Drinks'};
 document.querySelectorAll('.filter').forEach(b=>b.textContent=fs[b.dataset.filter]); render();
};
function toast(t){const x=document.getElementById('toast');x.textContent=t+' ✓';x.style.opacity=1;x.style.transform='translate(-50%,0)';setTimeout(()=>{x.style.opacity=0;x.style.transform='translate(-50%,20px)'},1300)}
render();
</script>
